[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argus"
version = "0.1.0"
description = "AI-assisted Android application security testing built on Barrel"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0,<2",
  "httpx>=0.27,<0.29",
  "pydantic>=2.6,<3",
]

[project.scripts]
argus-mcp = "argus.mcp_server:main"

[tool.setuptools.packages.find]
include = ["argus*"]

[tool.ruff]
line-length = 100
target-version = "py311"
